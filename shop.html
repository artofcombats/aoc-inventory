<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AOC STORE · Art of Combats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#31200D;       /* AOC 深咖啡：主按鈕／深色字／深色區塊 */
  --red:#CF2E2E;         /* 只用在小標籤和「售完」 */
  --bg:#FFFFFF;
  --ph:#F4F4F5;          /* 缺照片替代圖底色 */
  --line:#E6E6E6;        /* 細線分區 */
  --text:#1A1A1A;
  --muted:#7A7A7A;
  --radius:12px;
  --en:'Plus Jakarta Sans','Noto Sans TC',sans-serif;
  --zh:'Noto Sans TC','Plus Jakarta Sans',-apple-system,sans-serif;
  --topoff:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--zh);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}
img{display:block;max-width:100%}
.en{font-family:var(--en)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* ‹ 返回上一頁（白底版） */
#aocback{position:sticky;top:0;z-index:999;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}
#aocback a{color:var(--muted);font-size:13px}

/* 頁首 */
header{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header .logo img{height:40px;width:auto}
header .logo .word{font-family:var(--en);font-weight:800;font-size:22px;letter-spacing:.04em;color:var(--brand)}
header nav{display:flex;gap:8px;align-items:center}

/* 膠囊按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;border:1.5px solid var(--brand);transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-solid{background:var(--brand);color:#fff}
.btn-line{background:#fff;color:var(--brand)}
.btn-sm{height:32px;padding:0 14px;font-size:13px}
.btn-white{background:#fff;color:var(--brand);border-color:#fff}

/* 形象區（目前為占位） */
.hero{margin:20px auto 0;border-radius:var(--radius);overflow:hidden;position:relative;aspect-ratio:16/7;background:linear-gradient(135deg,#F4F4F5 0%,#FFFFFF 55%,#EFEAE4 100%)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.hero .big{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center;font-family:var(--en);font-weight:800;font-size:clamp(44px,13vw,170px);line-height:1;letter-spacing:-.02em;color:var(--brand);opacity:.09;user-select:none;pointer-events:none}
.hero .tag{position:absolute;left:0;right:0;bottom:18%;text-align:center}
.hero .tag h1{font-family:var(--en);font-weight:700;font-size:clamp(18px,3vw,34px);letter-spacing:.02em;color:var(--brand)}
.hero .tag p{margin-top:6px;color:var(--muted);font-size:13px}
.hero .ph-note{position:absolute;right:12px;bottom:10px;font-size:11px;color:#B0B0B0;font-family:var(--en)}

/* 主區：側欄 + 商品 */
.main{display:grid;grid-template-columns:180px 1fr;gap:32px;margin-top:36px;align-items:start}
.side{position:sticky;top:calc(var(--topoff) + 16px)}
.side h3{font-family:var(--en);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.cats{display:flex;flex-direction:column;gap:2px}
.cat{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:999px;font-size:14px;color:var(--text);text-align:left}
.cat small{font-family:var(--en);color:var(--muted);font-size:12px}
.cat:hover{background:var(--ph)}
.cat.active{background:var(--brand);color:#fff}
.cat.active small{color:rgba(255,255,255,.7)}

.content{min-width:0}
.content-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
.content-head h2{font-size:18px;font-weight:700}
.content-head span{font-family:var(--en);font-size:12px;color:var(--muted)}
.section-label{font-family:var(--en);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;display:flex;align-items:center;gap:12px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}
.section-label:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

/* 卡片 */
.card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--brand);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.card:hover .card-img img.p{transform:scale(1.03)}
.card.soldout .card-img img.p.on{opacity:.5;filter:grayscale(.7)}
.card.soldout .card-img .ph img{opacity:.08}
.card.soldout .card-name,.card.soldout .prices{color:#9A9A9A}
.card.soldout .prices .member .num{color:#9A9A9A}
.card-img{position:relative;aspect-ratio:1/1;background:var(--ph);overflow:hidden}
.card-img img.p{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s,transform .3s}
.card-img img.p.on{opacity:1}
.card-img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card-img .ph img{height:28%;width:auto;opacity:.16}
.card-img .ph .word{font-family:var(--en);font-weight:800;font-size:22px;color:var(--brand);opacity:.25}
.tag-cat{position:absolute;z-index:2;top:10px;right:10px;background:#fff;color:var(--brand);font-size:11px;font-weight:500;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.card-body{padding:14px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-name{font-size:14px;font-weight:500;line-height:1.4;min-height:2.8em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prices{display:flex;flex-direction:column;gap:2px}
.prices div{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.prices .lbl{color:var(--muted)}
.prices .num{font-family:var(--en);font-weight:600}
.prices .member .num{color:var(--brand);font-size:16px;font-weight:700}
.stock{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.stock::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.stock.low{color:var(--brand);font-weight:500}
.stock.out{color:#fff;background:var(--red);padding:2px 8px;border-radius:999px;font-weight:500}
.stock.out::before{display:none}

.empty,.loading{padding:60px 0;text-align:center;color:var(--muted)}
.spinner{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 深色 CTA */
.cta{margin:64px auto 0;background:var(--brand);color:#fff;border-radius:var(--radius);padding:44px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.cta h2{font-size:20px;font-weight:700;line-height:1.5}
.cta p{margin-top:6px;color:rgba(255,255,255,.7);font-size:13px;font-family:var(--en);letter-spacing:.04em}

/* 頁尾 */
footer{margin-top:40px;border-top:1px solid var(--line);padding:32px 0 calc(32px + env(safe-area-inset-bottom))}
footer .row{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.social{display:flex;gap:10px}
.social a{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--brand)}
.social a:hover{background:var(--ph)}
.social svg{width:18px;height:18px}
footer .addr{font-size:13px;color:var(--muted);text-align:right}
footer .copy{margin-top:20px;font-family:var(--en);font-size:11px;color:#B0B0B0;letter-spacing:.06em}

/* 詳情 */
.modal{position:fixed;inset:0;z-index:1000;background:rgba(26,26,26,.5);display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:var(--radius);width:100%;max-width:920px;max-height:calc(100vh - 48px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative}
.sheet .close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:18px;line-height:1;z-index:2;display:flex;align-items:center;justify-content:center}
.d-img{background:var(--ph);aspect-ratio:1/1;position:relative;overflow:hidden}
.d-img img.p{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover}
.d-img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.d-img .ph img{height:28%;width:auto;opacity:.16}
.d-info{padding:36px 32px 28px;display:flex;flex-direction:column;gap:18px}
.d-cat{font-size:12px;color:var(--muted)}
.d-name{font-size:22px;font-weight:700;line-height:1.35}
.d-prices{display:flex;gap:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.d-prices div{display:flex;flex-direction:column;gap:2px}
.d-prices .lbl{font-size:12px;color:var(--muted)}
.d-prices .num{font-family:var(--en);font-weight:700;font-size:20px}
.d-prices .member .num{color:var(--brand)}
.d-sizes h4{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:8px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.size b{font-family:var(--en);font-weight:600}
.size .lbl{color:var(--muted);font-size:12px}
.size.out{color:#B0B0B0}
.size.out b{color:#B0B0B0;text-decoration:line-through}
.thumbs{display:flex;gap:8px;padding:10px;background:#fff;grid-column:1;border-top:1px solid var(--line)}
.thumbs div{width:56px;height:56px;border-radius:8px;overflow:hidden;border:1.5px solid transparent;cursor:pointer;background:var(--ph)}
.thumbs div.active{border-color:var(--brand)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.d-left{display:flex;flex-direction:column}
.d-info .btn{align-self:flex-start;margin-top:auto}

/* 手機 */
@media (max-width:767px){
  .wrap{padding:0 16px}
  header{height:56px}
  header .logo img{height:34px}
  .hero{margin-top:12px;aspect-ratio:4/3}
  .hero .tag{bottom:16%}
  .main{display:block;margin-top:24px}
  .side{position:sticky;top:var(--topoff);background:#fff;z-index:5;margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .side h3{display:none}
  .cats{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:none;padding:7px 14px;font-size:13px;border:1px solid var(--line)}
  .cat small{display:none}
  .cat.active{border-color:var(--brand)}
  .content-head{margin-top:16px;margin-bottom:14px;padding-bottom:10px}
  .content-head h2{font-size:16px}
  .section-label{margin:22px 0 10px}
  .grid{grid-template-columns:1fr 1fr;gap:12px}
  .card-body{padding:10px 10px 12px;gap:6px}
  .card-name{font-size:13px}
  .prices div{font-size:12px}
  .prices .member .num{font-size:15px}
  .tag-cat{top:8px;right:8px;font-size:10px;padding:2px 7px}
  .cta{margin-top:40px;padding:28px 20px;flex-direction:column;align-items:flex-start;gap:18px}
  .cta h2{font-size:17px}
  footer .row{flex-direction:column;align-items:flex-start}
  footer .addr{text-align:left}
  .modal{padding:0;align-items:flex-end}
  .sheet{grid-template-columns:1fr;max-height:92vh;border-radius:var(--radius) var(--radius) 0 0}
  .d-info{padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
  .d-name{font-size:18px}
  .d-info .btn{align-self:stretch}
}
</style>
</head>

<script>
const DB_URL = 'https://aoc-inventory-d151b-default-rtdb.firebaseio.com';
const MARK = 'assets/logo-mark.png';   // 缺照片時的替代圖
const CAT_ORDER = ['aoc','fairtex','shorts','wraps','gear','other'];
const CAT_NAMES = { aoc:'AOC 服飾', fairtex:'拳套', shorts:'拳褲', wraps:'手綁帶', gear:'裝備', other:'其他' };
const SHOW_SOLD_OUT = true;    // true = 全部售完的商品也列出來（紅色「售完」，排在分類最後、照片變淡）
const LOW_STOCK = 3;           // 剩 1–3 件 = 少量
const REFRESH_MS = 60000;      // 每 60 秒只重抓 products（16 KB），不抓照片
const AOC_ORDER = ['AOC 運動涼感T 白色','AOC 運動涼感T 黑色','AOC 運動涼感T 圓形LOGO款','AOC 運動涼感背心','AOC 運動防風外套','AOC 三件組','AOC 小毛巾','AOC 大浴巾','AOC水洗老爺帽'];
const SIZE_RANK = { XS:1, S:2, M:3, L:4, XL:5, XXL:6, '2XL':6 };
const SIZE_RE = /^(.*?)([\s\-]+|[^\x00-\x7F])(XS|S|M|L|XL|XXL|2XL|\d+\s?[oO][zZ])\s*(（兒童）|\(兒童\))?$/;

let groups = [];            // 顯示用：同款不同尺寸合併成一張卡
let currentCat = 'all';
let lastProductsRaw = '';
const photoKeys = {};       // 哪些商品 id 有照片（shallow，不含照片本身）
const photoCache = {};      // id -> { first: dataURI, all: [dataURI...] }

function money(n){ return '$' + Number(n||0).toLocaleString('en-US'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sizeKey(sz){ if(!sz) return 0; const m = sz.match(/^(\d+)/); return m ? 100 + Number(m[1]) : (SIZE_RANK[sz.toUpperCase()] || 50); }
function splitSize(name){
  const m = String(name).trim().match(SIZE_RE);
  if (!m) return { base: String(name).trim(), size: null };
  const sep = m[2];
  const base = (m[1] + (/[\s\-]/.test(sep) ? '' : sep)).trim();
  let size = m[3].replace(/\s/g,'').replace(/oz/i,'oz') + (m[4] ? '（兒童）' : '');
  return { base, size };
}
function stockState(n){ return n <= 0 ? 'out' : n <= LOW_STOCK ? 'low' : 'ok'; }
function stockText(n){ return n <= 0 ? '售完' : n <= LOW_STOCK ? '少量' : '有貨'; }
function stockHtml(n){ return `<span class="stock ${stockState(n)}">${stockText(n)}</span>`; }

function buildGroups(prodData){
  let list = Array.isArray(prodData) ? prodData.filter(Boolean)
    : Object.keys(prodData).map(k => (prodData[k] && typeof prodData[k]==='object') ? { id:k, ...prodData[k] } : null).filter(Boolean);
  const map = {};
  list.forEach(p => {
    const { base, size } = splitSize(p.name || '');
    const key = (p.cat||'other') + '|' + base;
    if (!map[key]) map[key] = { key, cat: p.cat||'other', name: base, variants: [] };
    map[key].variants.push({ id:p.id, sku:p.sku, size, stock:Number(p.stock)||0, p1:Number(p.p1)||0, p2:Number(p.p2)||0 });
  });
  const out = Object.values(map).map(g => {
    g.variants.sort((a,b) => sizeKey(a.size) - sizeKey(b.size));
    g.stock = g.variants.reduce((s,v) => s + v.stock, 0);
    const inStock = g.variants.filter(v => v.stock > 0);
    const ref = inStock.length ? inStock : g.variants;
    g.p1 = Math.min(...ref.map(v => v.p1)); g.p2 = Math.min(...ref.map(v => v.p2));
    g.p1max = Math.max(...ref.map(v => v.p1)); g.p2max = Math.max(...ref.map(v => v.p2));
    g.photoId = (g.variants.find(v => photoKeys[v.id]) || {}).id || null;
    return g;
  });
  return sortGroups(out);
}
function sortGroups(arr){
  return arr.sort((a,b) => {
    const ci = CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat);
    if (ci) return ci;
    const so = (a.stock > 0 ? 0 : 1) - (b.stock > 0 ? 0 : 1);   // 售完排最後
    if (so) return so;
    if (a.cat === 'aoc') {
      const ai = AOC_ORDER.findIndex(k => a.name.startsWith(k)), bi = AOC_ORDER.findIndex(k => b.name.startsWith(k));
      if (ai !== -1 && bi !== -1 && ai !== bi) return ai - bi;
      if (ai !== -1 && bi === -1) return -1;
      if (bi !== -1 && ai === -1) return 1;
    }
    return a.name.localeCompare(b.name, 'zh-TW');
  });
}
function visible(){ return groups.filter(g => SHOW_SOLD_OUT || g.stock > 0); }

function phHtml(){ return `<div class="ph"><img src="${MARK}" alt=""></div>`; }

function renderCats(){
  const all = visible();
  const counts = {}; all.forEach(g => counts[g.cat] = (counts[g.cat]||0) + 1);
  let html = `<button class="cat ${currentCat==='all'?'active':''}" onclick="filterCat('all')"><span>全部</span><small>${all.length}</small></button>`;
  CAT_ORDER.forEach(c => {
    if (!counts[c]) return;
    html += `<button class="cat ${currentCat===c?'active':''}" onclick="filterCat('${c}')"><span>${CAT_NAMES[c]}</span><small>${counts[c]}</small></button>`;
  });
  document.getElementById('cats').innerHTML = html;
}

function cardHtml(g){
  const priceNum = (lo,hi) => money(lo) + (hi > lo ? ' 起' : '');
  const img = g.photoId ? `<img class="p" data-photo="${g.photoId}" alt="${esc(g.name)}">` : '';
  return `<div class="card${g.stock > 0 ? '' : ' soldout'}" role="button" tabindex="0" aria-label="${esc(g.name)}" onclick="openDetail('${esc(g.key)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDetail('${esc(g.key)}')}">
    <div class="card-img">${phHtml()}${img}<span class="tag-cat">${CAT_NAMES[g.cat]||g.cat}</span></div>
    <div class="card-body">
      <div class="card-name">${esc(g.name)}</div>
      <div class="prices">
        <div><span class="lbl">一般價</span><span class="num">${priceNum(g.p1,g.p1max)}</span></div>
        <div class="member"><span class="lbl">會員價</span><span class="num">${priceNum(g.p2,g.p2max)}</span></div>
      </div>
      ${stockHtml(g.stock)}
    </div>
  </div>`;
}

function render(){
  renderCats();
  const wrap = document.getElementById('grid-wrap');
  const list = visible().filter(g => currentCat === 'all' || g.cat === currentCat);
  document.getElementById('head-title').textContent = currentCat === 'all' ? '全部商品' : CAT_NAMES[currentCat];
  document.getElementById('head-count').textContent = list.length + ' items';
  if (!list.length) { wrap.innerHTML = '<div class="empty">此分類目前無商品</div>'; return; }
  let html = '';
  if (currentCat === 'all') {
    CAT_ORDER.forEach(c => {
      const gs = list.filter(g => g.cat === c);
      if (!gs.length) return;
      html += `<div class="section-label">${CAT_NAMES[c]}</div><div class="grid">${gs.map(cardHtml).join('')}</div>`;
    });
  } else {
    html = `<div class="grid">${list.map(cardHtml).join('')}</div>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll('img[data-photo]').forEach(el => lazyObs.observe(el));
}

function filterCat(c){
  currentCat = c; render();
  const top = document.querySelector('.content').getBoundingClientRect().top + window.scrollY - 70;
  if (window.scrollY > top) window.scrollTo({ top, behavior: 'smooth' });
}

/* 照片：滑到才載入，而且只抓那一張（/photos/<id>/imgs/0），不是整包 20 MB */
const lazyObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const el = e.target; lazyObs.unobserve(el);
    loadFirstPhoto(el.dataset.photo).then(src => { if (src) { el.src = src; el.classList.add('on'); } });
  });
}, { rootMargin: '300px 0px' });

function loadFirstPhoto(id){
  const c = photoCache[id] = photoCache[id] || {};
  if (c.first) return Promise.resolve(c.first);
  if (c.all && c.all.length) return Promise.resolve(c.all[0]);
  if (!c.firstReq) c.firstReq = fetch(`${DB_URL}/photos/${encodeURIComponent(id)}/imgs/0.json`)
    .then(r => r.json()).then(src => { if (typeof src === 'string') c.first = src; return c.first || null; })
    .catch(() => null);
  return c.firstReq;
}
function loadAllPhotos(id){
  const c = photoCache[id] = photoCache[id] || {};
  if (c.all) return Promise.resolve(c.all);
  if (!c.allReq) c.allReq = fetch(`${DB_URL}/photos/${encodeURIComponent(id)}.json`)
    .then(r => r.json()).then(d => { c.all = (d && d.imgs) ? d.imgs.filter(Boolean) : (d && d.img ? [d.img] : []); return c.all; })
    .catch(() => c.first ? [c.first] : []);
  return c.allReq;
}

/* 詳情 */
let detailKey = null;
function openDetail(key){
  const g = groups.find(x => x.key === key); if (!g) return;
  detailKey = key;
  document.getElementById('d-cat').textContent = CAT_NAMES[g.cat] || g.cat;
  document.getElementById('d-name').textContent = g.name;
  document.getElementById('d-p1').textContent = money(g.p1) + (g.p1max > g.p1 ? ' 起' : '');
  document.getElementById('d-p2').textContent = money(g.p2) + (g.p2max > g.p2 ? ' 起' : '');
  const multiPrice = g.p1max > g.p1 || g.p2max > g.p2;
  const sized = g.variants.some(v => v.size);
  document.getElementById('d-sizes-title').textContent = sized ? '尺寸與庫存' : '庫存';
  document.getElementById('d-sizes').innerHTML = g.variants.map(v =>
    `<span class="size ${stockState(v.stock)}">${v.size ? `<b>${esc(v.size)}</b>` : ''}${multiPrice ? `<span class="lbl">會員 ${money(v.p2)}</span>` : ''}${stockHtml(v.stock)}</span>`).join('');
  const imgBox = document.getElementById('d-img'), thumbs = document.getElementById('d-thumbs');
  imgBox.innerHTML = phHtml(); thumbs.hidden = true; thumbs.innerHTML = '';
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (!g.photoId) return;
  const id = g.photoId;
  const c = photoCache[id] || {};
  if (c.first) imgBox.innerHTML = `<img class="p" id="d-main" src="${c.first}" alt="">`;
  loadAllPhotos(id).then(imgs => {
    if (detailKey !== key || !imgs.length) return;
    imgBox.innerHTML = `<img class="p" id="d-main" src="${imgs[0]}" alt="">`;
    if (imgs.length > 1) {
      thumbs.hidden = false;
      thumbs.innerHTML = imgs.map((s,i) => `<div class="${i?'':'active'}" onclick="detailGo(${i})"><img src="${s}" alt=""></div>`).join('');
    }
  });
}
function detailGo(i){
  const g = groups.find(x => x.key === detailKey); if (!g) return;
  const imgs = (photoCache[g.photoId] || {}).all || [];
  if (!imgs[i]) return;
  document.getElementById('d-main').src = imgs[i];
  document.querySelectorAll('#d-thumbs div').forEach((t,j) => t.classList.toggle('active', j === i));
}
function closeDetail(){
  detailKey = null;
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

/* 資料：products（約 16 KB）＋ photos 的 key 清單（shallow，不含照片） */
function loadProducts(first){
  return fetch(`${DB_URL}/products.json`).then(r => r.text()).then(raw => {
    if (!first && raw === lastProductsRaw) return;      // 沒變就不重畫
    lastProductsRaw = raw;
    const data = JSON.parse(raw);
    groups = data ? buildGroups(data) : [];
    if (!groups.length) { document.getElementById('grid-wrap').innerHTML = '<div class="empty">目前暫無商品資料</div>'; return; }
    render();
  });
}
(function init(){
  const topbar = document.getElementById('aocback');
  if (topbar && !topbar.hidden) document.documentElement.style.setProperty('--topoff', topbar.offsetHeight + 'px');
  fetch(`${DB_URL}/photos.json?shallow=true`).then(r => r.json()).then(k => { Object.assign(photoKeys, k || {}); }).catch(() => {})
    .then(() => loadProducts(true))
    .catch(err => {
      console.error('載入發生錯誤:', err);
      document.getElementById('grid-wrap').innerHTML = '<div class="empty">無法載入，請重新整理</div>';
    });
  setInterval(() => { if (document.visibilityState === 'visible') loadProducts(false).catch(() => {}); }, REFRESH_MS);
})();
</script>
