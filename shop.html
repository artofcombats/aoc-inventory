<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art of Combats · 商品</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --black:#0a0a0a; --dark:#111; --card:#1a1a1a; --border:#2a2a2a;
    --red:#c8273a; --white:#f0ece4; --gray:#888; --green:#3a9e66; --orange:#c46b1a;
  }
  body { background:var(--black); color:var(--white); font-family:'Noto Sans TC',sans-serif; min-height:100vh; }

  header { background:var(--dark); border-bottom:2px solid var(--red); padding:0 28px; height:70px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .logo img { height:44px; object-fit:contain; display:block; }
  .header-right { font-size:12px; color:var(--gray); letter-spacing:0.5px; }

  .hero { background:linear-gradient(180deg,#1a0a0d 0%,var(--black) 100%); padding:48px 28px 40px; text-align:center; border-bottom:1px solid var(--border); }
  .hero-title { font-family:'Bebas Neue',sans-serif; font-size:48px; letter-spacing:4px; margin-bottom:8px; }
  .hero-title span { color:var(--red); }
  .hero-sub { font-size:13px; color:var(--gray); letter-spacing:1px; }

  .filter-bar { padding:20px 28px; display:flex; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--border); background:var(--dark); position:sticky; top:70px; z-index:90; }
  .filter-chip { padding:6px 16px; border-radius:20px; border:1px solid var(--border); color:var(--gray); font-size:13px; font-weight:500; cursor:pointer; background:transparent; font-family:'Noto Sans TC',sans-serif; transition:all 0.2s; }
  .filter-chip:hover, .filter-chip.active { border-color:var(--red); color:var(--white); background:rgba(200,39,58,0.1); }

  .grid-wrap { padding:28px; }
  .section-label { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:var(--gray); margin-bottom:16px; display:flex; align-items:center; gap:10px; }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  .product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; margin-bottom:40px; }
  .product-card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; transition:transform 0.2s,border-color 0.2s; cursor:pointer; }
  .product-card:hover { transform:translateY(-3px); border-color:#3a3a3a; }

  /* 封面照片：正方形 */
  .card-photo { width:100%; aspect-ratio:1/1; background:#222; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  .card-photo img { width:100%; height:100%; object-fit:cover; }
  .card-photo-placeholder { display:flex; flex-direction:column; align-items:center; gap:8px; color:#333; }
  .card-photo-placeholder svg { width:40px; height:40px; }
  .card-photo-placeholder span { font-size:11px; letter-spacing:0.5px; }
  /* 多張照片角標 */
  .photo-count { position:absolute; bottom:6px; right:8px; background:rgba(0,0,0,0.6); color:white; font-size:10px; padding:2px 7px; border-radius:10px; letter-spacing:0.3px; }

  .card-info { padding:14px; }
  .card-name { font-size:13px; font-weight:700; margin-bottom:6px; line-height:1.4; }
  .card-sku { font-size:10px; color:var(--gray); font-family:monospace; margin-bottom:8px; }
  .card-prices { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .price-normal-s { font-family:'Bebas Neue',sans-serif; font-size:15px; color:var(--white); }
  .price-label { font-size:9px; color:var(--gray); letter-spacing:0.5px; display:block; margin-bottom:1px; }
  .price-member-s { font-family:'Bebas Neue',sans-serif; font-size:15px; color:#d4a843; }
  .card-stock { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .stock-ok  { background:rgba(58,158,102,0.15); color:var(--green); }
  .stock-low { background:rgba(196,107,26,0.15);  color:var(--orange); }
  .stock-out { background:rgba(200,39,58,0.15);   color:var(--red); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }

  .loading { text-align:center; padding:80px 20px; color:var(--gray); }
  .spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--red); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .empty { text-align:center; padding:60px 20px; color:var(--gray); grid-column:1/-1; }

  /* ── LIGHTBOX ── */
  .lb-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1000; flex-direction:column; }
  .lb-overlay.open { display:flex; }
  .lb-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .lb-title { font-size:15px; font-weight:700; }
  .lb-sub { font-size:12px; color:var(--gray); margin-top:2px; }
  .lb-close { background:none; border:none; color:var(--white); font-size:24px; cursor:pointer; padding:4px 8px; }
  .lb-main { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:16px; }
  .lb-main img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
  .lb-main .no-photo { color:var(--gray); font-size:14px; }
  .lb-thumbs { display:flex; gap:10px; padding:16px 20px; overflow-x:auto; flex-shrink:0; border-top:1px solid var(--border); }
  .lb-thumb { width:64px; height:64px; border-radius:8px; overflow:hidden; cursor:pointer; border:2px solid transparent; flex-shrink:0; transition:border-color 0.15s; }
  .lb-thumb.active { border-color:var(--red); }
  .lb-thumb img { width:100%; height:100%; object-fit:cover; }
  .lb-info { padding:0 20px 20px; flex-shrink:0; }
  .lb-stock { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; padding:5px 12px; border-radius:20px; }

  footer { border-top:1px solid var(--border); padding:24px 28px; text-align:center; font-size:12px; color:var(--gray); }

  @media(max-width:600px) {
    .product-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
    .grid-wrap { padding:14px; }
    .hero-title { font-size:36px; }
    .filter-bar { padding:12px 14px; }
    header { padding:0 16px; }
  }
</style>
</head>

  </div>
</div>

<footer>© Art of Combats 格鬥藝術泰拳館 · 庫存即時更新</footer>

<script>
const CAT_NAMES = { aoc:'AOC', fairtex:'拳套', shorts:'拳褲', wraps:'手綁帶', gear:'裝備', other:'其他' };
let allProducts = [];
let currentCat = 'all';

function getImgs(p) {
  if (p.imgs && p.imgs.length) return p.imgs;
  if (p.img) return [p.img];
  return [];
}

function stockBadge(n) {
  if (n === 0)  return `<span class="card-stock stock-out"><span class="dot"></span>售罄</span>`;
  if (n <= 10)  return `<span class="card-stock stock-low"><span class="dot"></span>剩 ${n} 件</span>`;
  return             `<span class="card-stock stock-ok"><span class="dot"></span>剩 ${n} 件</span>`;
}

function stockBadgeLg(n) {
  const cls = n === 0 ? 'stock-out' : n <= 10 ? 'stock-low' : 'stock-ok';
  const txt = n === 0 ? '售罄' : `剩 ${n} 件`;
  return `<span class="lb-stock ${cls}"><span class="dot"></span>${txt}</span>`;
}

function photoEl(p) {
  const imgs = getImgs(p);
  if (imgs.length > 0) {
    const badge = imgs.length > 1 ? `<div class="photo-count">📷 ${imgs.length}</div>` : '';
    
    // 🎯 拿掉原本對 GitHub 路徑的加工，100% 相信並直接讀取 Firebase Realtime Database 抓出來的原始圖片路徑
    return `<img src="${imgs[0]}" alt="${p.name}" loading="lazy">${badge}`;
  }
  return `<div class="card-photo-placeholder">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
      <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="M21 15l-5-5L5 21"/>
    </svg><span>暫無圖片</span></div>`;
}
const AOC_ORDER = [
  'AOC 運動涼感T 白色',
  'AOC 運動涼感T 黑色',
  'AOC 運動防風外套',
  'AOC 三件組',
  'AOC 小毛巾',
  'AOC 大浴巾',
  'AOC 帽',
];

function sortByName(arr) {
  return [...arr].sort((a, b) => {
    if (a.cat === 'aoc' && b.cat === 'aoc') {
      const ai = AOC_ORDER.findIndex(k => a.name.startsWith(k));
      const bi = AOC_ORDER.findIndex(k => b.name.startsWith(k));
      if (ai !== -1 && bi !== -1) return ai - bi;
      if (ai !== -1) return -1;
      if (bi !== -1) return 1;
    }
    return a.name.localeCompare(b.name, 'zh-TW');
  });
}

function render() {
  const wrap = document.getElementById('grid-wrap');
  const filtered = sortByName(
    (currentCat === 'all' ? allProducts : allProducts.filter(p => p.cat === currentCat))
    .filter(p => p.stock > 0) // 隱藏售罄商品
  );
  if (filtered.length === 0) { wrap.innerHTML = `<div class="empty">此分類目前無商品</div>`; return; }
  const groups = {};
  filtered.forEach(p => { if (!groups[p.cat]) groups[p.cat] = []; groups[p.cat].push(p); });
  const catOrder = ['aoc','fairtex','shorts','wraps','gear','other'];
  let html = '';
  catOrder.forEach(cat => {
    if (!groups[cat] || !groups[cat].length) return;
    const label = currentCat === 'all' ? `<div class="section-label">${CAT_NAMES[cat]||cat}</div>` : '';
    const cards = groups[cat].map(p => `
      <div class="product-card" onclick="openLB('${p.id}')">
        <div class="card-photo">${photoEl(p)}</div>
        <div class="card-info">
          <div class="card-name">${p.name}</div>
          <div class="card-sku">${p.sku}</div>
          <div class="card-prices">
            <div><span class="price-label">一般價</span><span class="price-normal-s">$${p.p1.toLocaleString()}</span></div>
            <div><span class="price-label">會員價</span><span class="price-member-s">$${p.p2.toLocaleString()}</span></div>
          </div>
          ${stockBadge(p.stock)}
        </div>
      </div>`).join('');
    html += label + `<div class="product-grid">${cards}</div>`;
  });
  wrap.innerHTML = html;
}

function filterCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── LIGHTBOX ──
let lbCurIdx = 0;

function openLB(pid) {
  const p = allProducts.find(x => x.id === pid);
  if (!p) return;
  const imgs = getImgs(p);
  lbCurIdx = 0;

  document.getElementById('lb-name').textContent = p.name;
  document.getElementById('lb-sku').textContent = p.sku;
  document.getElementById('lb-stock').outerHTML = stockBadgeLg(p.stock);

  // 主圖
  const main = document.getElementById('lb-main');
  if (imgs.length > 0) {
    main.innerHTML = `<img src="${imgs[0]}" id="lb-img">`;
  } else {
    main.innerHTML = `<div class="no-photo">暫無圖片</div>`;
  }

  // 縮圖列（有多張才顯示）
  const thumbs = document.getElementById('lb-thumbs');
  if (imgs.length > 1) {
    thumbs.style.display = 'flex';
    thumbs.innerHTML = imgs.map((src, i) =>
      `<div class="lb-thumb ${i===0?'active':''}" onclick="lbGo(${i})">
        <img src="${src}">
      </div>`).join('');
  } else {
    thumbs.style.display = 'none';
    thumbs.innerHTML = '';
  }

  document.getElementById('lb-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  
  // 重新設定 stock badge
  document.getElementById('lb-stock').outerHTML = stockBadgeLg(p.stock);
  setTimeout(() => {
    const s = document.getElementById('lb-stock');
    if (s) s.outerHTML = stockBadgeLg(p.stock);
  }, 10);
}

function lbGo(idx) {
  const nameEl = document.getElementById('lb-name');
  if (!nameEl) return;
  const p = allProducts.find(x => x.name === nameEl.textContent);
  if (!p) return;
  const imgs = getImgs(p);
  lbCurIdx = idx;
  const imgEl = document.getElementById('lb-img');
  if (imgEl) imgEl.src = imgs[idx];
  document.querySelectorAll('.lb-thumb').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
}

function closeLBBtn() {
  document.getElementById('lb-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeLB(e) {
  if (e.target === document.getElementById('lb-overlay')) closeLBBtn();
}

// Firebase REST API（已修正物件與陣列轉換問題）
(function() {
  const DB_URL = 'https://aoc-inventory-d151b-default-rtdb.firebaseio.com';
  function load() {
    fetch(DB_URL + '/products.json')
      .then(r => r.json())
      .then(data => {
        if (data) {
          let parsedData = [];
          if (Array.isArray(data)) {
            parsedData = data.filter(Boolean);
          } else {
            parsedData = Object.keys(data).map(key => {
              if (data[key] && typeof data[key] === 'object') {
                return { id: key, ...data[key] };
              }
              return data[key];
            }).filter(Boolean);
          }

          if (parsedData.length > 0) {
            allProducts = parsedData;
            render();
          } else {
            document.getElementById('grid-wrap').innerHTML = '<div class="empty">目前暫無商品資料</div>';
          }
        } else {
          document.getElementById('grid-wrap').innerHTML = '<div class="empty">目前暫無商品資料</div>';
        }
      })
      .catch((err) => {
        console.error(err);
        document.getElementById('grid-wrap').innerHTML = '<div class="loading"><div style="color:var(--red)">⚠️ 無法載入，請重新整理</div></div>';
      });
  }
  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
